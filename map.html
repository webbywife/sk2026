<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FFF8FA;
    --panel-2:#FDEAF1;
    --text:#3A2E38;
    --text-dim:#6B5860;
    --line: rgba(58,46,56,0.12);
    --d1:#C22A66;
    --d2:#A85A16;
    --d3:#7A6A10;
    --d4:#2E7D4F;
    --d5:#6B4FB0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 8% 0%, rgba(225,74,128,0.06), transparent 45%),
      var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.16em;
    color:var(--d1);
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:500;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--d1);}

  .back-link{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:12px;
  }
  .back-link:hover{background:var(--panel-2);}

  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    cursor:pointer;
    transition:opacity 0.15s ease;
  }
  .filter-btn .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .filter-btn .dot:not(:empty){
    width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    font-size:9px; line-height:1;
  }
  .filter-btn.off{opacity:0.35;}
  .filter-btn:hover{opacity:0.75;}
  .filter-btn.off:hover{opacity:0.55;}

  #map{flex:1; min-height:0;}

  .leaflet-popup-content-wrapper{
    background:var(--panel);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(58,46,56,0.15);
    padding:0;
    overflow:hidden;
  }
  .leaflet-popup-content{margin:0; width:240px !important;}
  .leaflet-popup-tip{background:var(--panel);}
  .popup-photo{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }
  .popup-body{padding:12px 14px 14px;}
  .popup-day{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:3px;
    font-weight:600;
  }
  .popup-time{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .popup-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .popup-note{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .popup-transport{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--text);
    line-height:1.5;
  }
  .transport-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--d1);
    margin-bottom:2px;
    font-weight:600;
  }
  .sv-link{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--panel-2);
    border-radius:8px;
    padding:7px 10px;
  }
  .sv-link:hover{background:var(--line);}

  .pin{
    width:16px;
    height:16px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  .pin-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    line-height:1;
  }

  @media (max-width:640px){
    h1{font-size:20px;}
    .filter-btn{font-size:12px; padding:6px 11px 6px 8px;}
  }
</style>
</head>

    { kind:"subway", name:"Sinsa Station", lat:37.5162, lon:127.0204, note:"Line 3 — closest stop to Garosu-gil" },
    { kind:"subway", name:"Apgujeongrodeo Station", lat:37.5274, lon:127.0404, note:"Suin-Bundang Line — closest stop to Dosan Park / Apgujeong" },
    { kind:"subway", name:"Express Bus Terminal Station", lat:37.5049, lon:127.0047, note:"Lines 3, 7, 9 — exit straight into Goto Mall" },
    { kind:"subway", name:"Myeongdong Station", lat:37.5606, lon:126.9865, note:"Line 4 — right at the Myeongdong shopping strip" },
    { kind:"subway", name:"Hoehyeon Station", lat:37.5585, lon:126.9779, note:"Line 4 — closest stop to Namdaemun Market" },
    { kind:"subway", name:"Gyeongbokgung Station", lat:37.5765, lon:126.9744, note:"Line 3 — right at the palace" },
    { kind:"subway", name:"Anguk Station", lat:37.5762, lon:126.9853, note:"Line 3 — closest stop to Bukchon and Insadong" },
    { kind:"subway", name:"Jongno 3(sam)-ga Station", lat:37.5703, lon:126.9917, note:"Lines 1, 3, 5 — closest stop to Ikseon-dong and the Jongno hotel" },
    { kind:"subway", name:"Incheon Airport T1 Station", lat:37.4488, lon:126.4505, note:"AREX Airport Railroad — alternative to the limousine bus" },
    { kind:"bus", name:"COEX City Airport Terminal", lat:37.5106, lon:127.0605, note:"Airport Limousine Bus #6103 drop-off on arrival, Day 1" },
    { kind:"bus", name:"Express Bus Terminal", lat:37.5049, lon:127.0047, note:"Intercity/express bus terminal, same building as Goto Mall" },
    { kind:"bus", name:"Gwanghwamun Limousine Bus Stop", lat:37.5715, lon:126.9755, note:"Airport Limousine Bus pickup for departure, Day 5" },
  ];

  const transitTypes = {
    subway: { label: "Subway / Train", color: "#1565C0", emoji: "🚇" },
    bus:    { label: "Bus",            color: "#E65100", emoji: "🚌" },
  };

  const map = L.map('map', { zoomControl: true }).setView([37.545, 127.01], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color){
    return L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${color}"></div>`,
      iconSize: [16,16],
      iconAnchor: [8,14],
      popupAnchor: [0,-14]
    });
  }

  function makeCircleIcon(color, emoji, size){
    size = size || 22;
    return L.divIcon({
      className: '',
      html: `<div class="pin-circle" style="background:${color}">${emoji}</div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2]
    });
  }

  const dayLayers = {};
  Object.keys(days).forEach(d => dayLayers[d] = L.layerGroup().addTo(map));

  places.forEach(p => {
    const color = days[p.day].color;
    const icon = p.shop ? makeCircleIcon(color, '🛍️', 20) : makeIcon(color);
    const marker = L.marker([p.lat, p.lon], { icon });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      (p.photo ? `<img class="popup-photo" src="${p.photo}" alt="${p.name}" loading="lazy">` : '') +
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${color}">${days[p.day].label}${p.shop ? ' · 🛍️ Shopping' : ''}</div>` +
      `<div class="popup-time">${p.time}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      (p.transport ? `<div class="popup-transport"><span class="transport-label">Getting there</span>${p.transport}</div>` : '') +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(dayLayers[p.day]);
  });

  const transitLayers = {};
  Object.keys(transitTypes).forEach(k => transitLayers[k] = L.layerGroup().addTo(map));

  transitPlaces.forEach(p => {
    const info = transitTypes[p.kind];
    const marker = L.marker([p.lat, p.lon], { icon: makeCircleIcon(info.color, info.emoji, 20) });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${info.color}">${info.emoji} ${info.label}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(transitLayers[p.kind]);
  });

  // Filter buttons
  const filtersEl = document.getElementById('filters');
  const activeDays = new Set(Object.keys(days).map(Number));

  Object.entries(days).forEach(([d, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}"></span>${info.label}`;
    btn.addEventListener('click', () => {
      const dayNum = Number(d);
      if (activeDays.has(dayNum)) {
        activeDays.delete(dayNum);
        map.removeLayer(dayLayers[d]);
        btn.classList.add('off');
      } else {
        activeDays.add(dayNum);
        map.addLayer(dayLayers[d]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  const activeTransit = new Set(Object.keys(transitTypes));

  Object.entries(transitTypes).forEach(([k, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}">${info.emoji}</span>${info.label}`;
    btn.addEventListener('click', () => {
      if (activeTransit.has(k)) {
        activeTransit.delete(k);
        map.removeLayer(transitLayers[k]);
        btn.classList.add('off');
      } else {
        activeTransit.add(k);
        map.addLayer(transitLayers[k]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  // Fit bounds to all markers initially
  const allLatLngs = places.map(p => [p.lat, p.lon]);
  map.fitBounds(allLatLngs, { padding: [30,30] });
</script>
</body>
</html>
